name: CI

# Runs on every pull request whatever its base branch (a stacked branch is checked too), on pushes
# to main and develop, and in a merge queue. publish.yml calls it with workflow_call so a release
# cannot be published from a commit whose checks failed. The weekly schedule runs only the jobs
# that watch the outside world: the dependency audit and the ATT&CK drift check.

on:
  push:
    branches: [main, develop]
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      # actionlint reads workflow files only. It also runs shellcheck over their run: blocks.
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
      # The composite action is not a workflow, so actionlint cannot read it. Its scripts are
      # extracted and checked with shellcheck, which the runner image ships.
      - name: shellcheck the composite action
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile

          import yaml

          action = yaml.safe_load(pathlib.Path(".github/actions/threatcode/action.yml").read_text())
          failed = False
          with tempfile.TemporaryDirectory() as tmp:
              for index, step in enumerate(action["runs"]["steps"]):
                  if "run" not in step:
                      continue
                  script = pathlib.Path(tmp) / f"step{index}.sh"
                  script.write_text("#!/usr/bin/env bash\n" + step["run"])
                  proc = subprocess.run(["shellcheck", "-s", "bash", str(script)])
                  if proc.returncode:
                      print(f"shellcheck failed for step: {step['name']}", file=sys.stderr)
                      failed = True
          sys.exit(1 if failed else 0)
          PY

  typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy src/threatcode/

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=threatcode --cov-report=term-missing --cov-report=xml -q
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          # coverage.xml is a visible file. The hidden .coverage data file is left out of an
          # artifact unless include-hidden-files is set, which is how this upload once came up empty.
          path: coverage.xml
          if-no-files-found: error

  # The suite on the other two platforms. The scanner walks directories, refuses symlinks and
  # reads paths, which is where operating systems differ.
  test-platforms:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The HCL parser sits behind an adapter that normalizes python-hcl2 output across majors. The
  # lowest version the metadata allows and the newest major both have to pass, so a release of the
  # library cannot silently break Terraform scans.
  hcl2:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        hcl2: ["python-hcl2==4.3.5", "python-hcl2>=8,<9"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" "${{ matrix.hcl2 }}"
      - run: python -c "import importlib.metadata as m; print('python-hcl2', m.version('python-hcl2'))"
      # The whole suite, not a selection: it takes about a minute and the HCL values reach rules,
      # graph edges, goldens and every output format.
      - run: pytest -q

  # Runs the composite action from this checkout, so a bad pin or a broken script fails a pull
  # request rather than a user's build. upload is false: the job needs no Code Scanning permission.
  action:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan the AWS example (the default gate never fails)
        id: clean
        uses: ./.github/actions/threatcode
        with:
          path: examples/aws-webapp
          format: sarif
          upload: "false"
      - name: The outputs are filled and the report exists
        env:
          EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
          THREATS: ${{ steps.clean.outputs.threat-count }}
          PATHS: ${{ steps.clean.outputs.path-count }}
          REPORT: ${{ steps.clean.outputs.report-file }}
        run: |
          test "$EXIT_CODE" = "0"
          test "$THREATS" -gt 0
          test "$PATHS" -ge 0
          test "$REPORT" = "threatcode-results.sarif"
          test -s "$REPORT"
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert d["version"] == "2.1.0", d["version"]' "$REPORT"
      - name: The SARIF names files from the repository root
        env:
          REPORT: ${{ steps.clean.outputs.report-file }}
        run: |
          python3 - "$REPORT" <<'PY'
          import json
          import sys

          run = json.load(open(sys.argv[1]))["runs"][0]
          uris = {
              r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
              for r in run["results"]
          }
          assert uris, "no results"
          bad = sorted(u for u in uris if not u.startswith("examples/aws-webapp/"))
          assert not bad, f"not repository-relative: {bad}"
          PY

      - name: The report format changes the file, never the counts
        id: markdown
        uses: ./.github/actions/threatcode
        with:
          path: examples/aws-webapp
          format: markdown
          upload: "false"
      - name: The counts agree across formats
        env:
          SARIF_THREATS: ${{ steps.clean.outputs.threat-count }}
          MARKDOWN_THREATS: ${{ steps.markdown.outputs.threat-count }}
          MARKDOWN_REPORT: ${{ steps.markdown.outputs.report-file }}
        run: |
          test "$SARIF_THREATS" = "$MARKDOWN_THREATS"
          test "$MARKDOWN_REPORT" = "threatcode-results.md"

      - name: A path with spaces
        id: spaces
        run: |
          mkdir -p "$RUNNER_TEMP/a path with spaces"
          cp -R examples/aws-webapp "$RUNNER_TEMP/a path with spaces/aws"
          echo "dir=$RUNNER_TEMP/a path with spaces/aws" >> "$GITHUB_OUTPUT"
      - name: Scan it
        id: spaced
        uses: ./.github/actions/threatcode
        with:
          path: ${{ steps.spaces.outputs.dir }}
          format: json
          upload: "false"
      - name: It was found
        env:
          THREATS: ${{ steps.spaced.outputs.threat-count }}
        run: test "$THREATS" -gt 0

      # fail-on has to fail the job. continue-on-error keeps this job going so it can check the
      # outcome of each step that is supposed to fail.
      - name: The gate fails the job (medium findings, fail-on medium)
        id: gate-medium
        continue-on-error: true
        uses: ./.github/actions/threatcode
        with:
          path: examples/aws-webapp
          fail-on: medium
          upload: "false"
      - name: The gate fails the job (high findings, fail-on high)
        id: gate-high
        continue-on-error: true
        uses: ./.github/actions/threatcode
        with:
          path: examples/k8s-platform
          fail-on: high
          upload: "false"
      - name: An input error fails the job
        id: bad-path
        continue-on-error: true
        uses: ./.github/actions/threatcode
        with:
          path: examples/no-such-directory
          upload: "false"
      - name: Findings do not fail the job when fail-on is none
        id: not-gated
        continue-on-error: true
        uses: ./.github/actions/threatcode
        with:
          path: examples/k8s-platform
          fail-on: none
          upload: "false"
      - name: Check the outcomes
        env:
          GATE_MEDIUM: ${{ steps.gate-medium.outcome }}
          GATE_HIGH: ${{ steps.gate-high.outcome }}
          BAD_PATH: ${{ steps.bad-path.outcome }}
          NOT_GATED: ${{ steps.not-gated.outcome }}
        run: |
          test "$GATE_MEDIUM" = "failure" || { echo "fail-on medium did not fail: $GATE_MEDIUM" >&2; exit 1; }
          test "$GATE_HIGH" = "failure" || { echo "fail-on high did not fail: $GATE_HIGH" >&2; exit 1; }
          test "$BAD_PATH" = "failure" || { echo "a missing path did not fail: $BAD_PATH" >&2; exit 1; }
          test "$NOT_GATED" = "success" || { echo "fail-on none failed: $NOT_GATED" >&2; exit 1; }

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  # The dependency audit also runs weekly: a new advisory should surface without waiting for an
  # unrelated pull request.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pip freeze --exclude threatcode > _audit_reqs.txt && pip-audit --strict -r _audit_reqs.txt

  # Compares the committed ATT&CK tables with the newest published release. It reports a
  # difference and never blocks a pull request: it runs only on the schedule or by hand, and only
  # in this workflow (not when publish.yml calls it).
  mitre-drift:
    if: github.workflow == 'CI' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The committed tables match the pinned release
        run: python3 scripts/gen_mitre_db.py --check
      - name: The pinned release is still the newest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/mitre-attack/attack-stix-data/releases/latest --jq .tag_name)"
          latest="${latest#v}"
          echo "Newest published ATT&CK release: $latest"
          if ! python3 scripts/gen_mitre_db.py --version "$latest" --check; then
            echo "::warning title=ATT&CK drift::the tables differ from ATT&CK $latest. Run scripts/gen_mitre_db.py --version $latest and review the rule tactics."
            exit 1
          fi

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      # Builds the sdist, then the wheel from the sdist, so both artifacts are exercised.
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean venv and scan a fixture
        run: scripts/smoke_test_wheel.sh dist/*.whl
