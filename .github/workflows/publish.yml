name: Publish

# Publishes to PyPI with trusted publishing (OIDC, no API token) when a GitHub release is
# published. Nothing is published from a commit whose CI failed: the ci job below runs the whole
# CI workflow and the build job needs it.
#
# A manual run (workflow_dispatch) builds the same artifacts, checks them, and uploads them to
# TestPyPI as a dry run of the release. It never touches PyPI.
#
# Owner steps before the first release (nothing in this file can do them):
#   1. On pypi.org add a pending trusted publisher: project threatcode, owner ajokunu,
#      repository ThreatCode, workflow publish.yml, environment pypi.
#   2. On test.pypi.org add the same publisher with environment testpypi.
#   3. Create the GitHub environments pypi (add required reviewers) and testpypi.
#   4. Publish a GitHub release whose tag is v plus the version in src/threatcode/__init__.py.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # The version has one source, __version__, which setuptools reads at build time. The wheel
      # metadata is therefore what the tag has to match, and what the installed command reports.
      - name: Check the release tag matches the built version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(unzip -p dist/*.whl '*.dist-info/METADATA' | sed -n 's/^Version: //p' | head -n 1)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match the built version v$VERSION" >&2
            exit 1
          fi
      - name: Install the wheel in a clean venv and scan a fixture
        run: scripts/smoke_test_wheel.sh dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/threatcode/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/threatcode/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rerun of the same version is a dry run too, not a failure.
          skip-existing: true
