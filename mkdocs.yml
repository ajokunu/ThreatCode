site_name: ThreatCode
site_description: Attack paths from the internet to your data, found in the infrastructure code you already have
site_url: https://ajokunu.github.io/ThreatCode/
repo_url: https://github.com/ajokunu/ThreatCode
repo_name: ajokunu/ThreatCode

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md
  - CI/CD Integration: cicd.md
  - Configuration: configuration.md
  - Support Matrix: support-matrix.md
  - Architecture: architecture.md
  - Rule Catalog: rules.md
  - Rule Writing Guide: writing-rules.md
  - MITRE ATT&CK: mitre-attack.md
  - Benchmark: benchmark.md
  - Security: security.md
  - Security Model: security-model.md
  - API Reference: api-reference.md
  - Migrating from 0.9: migrating.md
  - Releasing: releasing.md
  - Claims: claims.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - toc:
      permalink: true

plugins:
  - search
