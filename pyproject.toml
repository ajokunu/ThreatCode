[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threatcode"
dynamic = ["version"]
description = "STRIDE threat models and attack paths from infrastructure code and AI-agent configs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Aaron Lindahl", email = "lindahlaaron@yahoo.com" }]
keywords = ["security", "threat-modeling", "stride", "terraform", "iac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.0,<3",
    "python-hcl2>=4.3,<5",
    "pyyaml>=6.0.1,<7",
    "networkx>=3.1,<4",
    "tomli>=2.0,<3;python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/ajokunu/ThreatCode"
Repository = "https://github.com/ajokunu/ThreatCode"
Issues = "https://github.com/ajokunu/ThreatCode/issues"

[project.optional-dependencies]
llm = [
    "anthropic>=0.39,<2",
]
all = [
    "anthropic>=0.39,<2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.15",
    "mypy>=1.5",
    "pip-audit>=2.6",
    "types-networkx>=3.1",
    "types-PyYAML>=6.0",
    "anthropic>=0.39,<2",
    "jsonschema>=4.0",
    "hypothesis>=6.0",
    "build>=1.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocs-autorefs",
    "mkdocstrings[python]",
]

[project.scripts]
threatcode = "threatcode.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "threatcode.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threatcode = ["py.typed", "engine/rules/builtin/**/*.yml"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
