# Rules on AWS Config.
#
# A missing record is a detection gap, not an attack technique, so these rules map to no ATT&CK
# technique and use the repudiation category.
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data
#   absence     the rule fires because something is missing (never above medium)

deprecated_ids:
  # s3_bucket_name is a required argument of a delivery channel, so a channel without one cannot
  # exist and the rule never fired.
  - CONFIG_NO_DELIVERY_CHANNEL
  # The aggregator is the resource being judged, so "no aggregator" cannot be seen from it, and
  # an organisation aggregator has no account_aggregation_source by design.
  - CONFIG_NO_AGGREGATION

rules:
  - id: CONFIG_NOT_ENABLED
    title: AWS Config recorder is turned off
    description: >
      The configuration recorder's status resource sets is_enabled to false, so Config does not
      record resource changes.
      Without a configuration history, a change an attacker makes to a security group, a policy
      or a bucket cannot be compared with the state before it.
    stride_category: repudiation
    severity: high
    confidence: definitive
    root_cause: config-not-recording
    resource_type: aws_config_configuration_recorder_status
    condition:
      is_enabled:
        equals: false
    mitigation: >
      Set is_enabled to true on aws_config_configuration_recorder_status, after the delivery
      channel exists.

  - id: CONFIG_NOT_ALL_RESOURCES
    title: AWS Config not recording all resource types
    description: >
      The recorder's recording_group sets all_supported to false, so only the resource types it
      lists are recorded.
      A change to any other type, including types AWS adds later, leaves no history.
    stride_category: repudiation
    severity: medium
    confidence: definitive
    root_cause: config-not-recording
    resource_type: aws_config_configuration_recorder
    condition:
      recording_group.all_supported:
        equals: false
    mitigation: >
      Set all_supported to true in the recording_group, and include_global_resource_types for one
      region.
