# ECS task definitions and services.
#
# The container rules read derived.container_definitions, the parsed container definitions of the
# task, so they see the same list whether the definition is a jsonencode() call, a heredoc, a
# plan's JSON string or a CloudFormation list.
# The keys are the camelCase names of the ECS API (privileged, readonlyRootFilesystem).
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data (never above high)
#   absence     the rule fires because something is missing (never above medium)

rules:
  - id: ECS_PRIVILEGED_CONTAINER
    title: ECS task runs a privileged container
    description: >
      A container definition sets privileged to true.
      The container gets nearly the same access to the host as a process on the host, so a
      compromised container can take over the instance and every other task on it.
    stride_category: elevation_of_privilege
    severity: high
    confidence: definitive
    root_cause: container-escape-to-host
    resource_type: aws_ecs_task_definition
    condition:
      derived.container_definitions:
        any_item:
          privileged:
            equals: true
    mitigation: >
      Remove privileged from the container definition and add only the Linux capabilities the
      workload needs.
    metadata:
      mitre:
        techniques: ["T1611"]

  - id: ECS_NO_READONLY_FS
    title: ECS container with a writable root filesystem
    description: >
      A container definition does not set readonlyRootFilesystem to true.
      The ECS default is a writable root filesystem, so an attacker who runs code in the
      container can drop tools and change binaries on it.
    stride_category: tampering
    severity: low
    confidence: absence
    root_cause: container-hardening-missing
    resource_type: aws_ecs_task_definition
    condition:
      derived.container_definitions:
        any_item:
          readonlyRootFilesystem:
            not_equals: true
    mitigation: >
      Set readonlyRootFilesystem to true, and mount a volume for the directories the application
      has to write.
    metadata:
      mitre:
        techniques: ["T1105"]

  - id: ECS_EXEC_ENABLED
    title: ECS service allows execute command
    description: >
      enable_execute_command is true, so principals with ecs:ExecuteCommand can open an
      interactive shell in the running containers.
      Access is governed by IAM and audited in CloudTrail, which makes this a note for production
      services.
    stride_category: elevation_of_privilege
    severity: low
    confidence: definitive
    resource_type: aws_ecs_service
    condition:
      enable_execute_command:
        equals: true
    mitigation: >
      Turn execute command off unless the service needs live debugging, and limit
      ecs:ExecuteCommand to the people who debug it.
    metadata:
      mitre:
        techniques: ["T1609"]

  - id: ECS_NO_LOGGING
    title: ECS container without a log configuration
    description: >
      A container definition has no logConfiguration, so the output of the container is not sent to
      CloudWatch Logs or another log driver.
    stride_category: repudiation
    severity: low
    confidence: absence
    root_cause: logging-not-enabled
    resource_type: aws_ecs_task_definition
    condition:
      derived.container_definitions:
        any_item:
          logConfiguration:
            not_exists: true
    mitigation: >
      Add a logConfiguration with the awslogs driver, or the driver of your log pipeline.
    metadata: {}

  - id: ECS_HOST_NETWORKING
    title: ECS task uses host network mode
    description: >
      The task shares the network namespace of the instance.
      A container can then bind the ports of the host, reach services listening on its loopback
      interface and read the traffic of the instance.
    stride_category: information_disclosure
    severity: medium
    confidence: definitive
    root_cause: container-escape-to-host
    resource_type: aws_ecs_task_definition
    condition:
      network_mode:
        equals: "host"
    mitigation: >
      Use the awsvpc network mode, which gives each task its own network interface and security
      group.
    metadata:
      mitre:
        techniques: ["T1040"]
