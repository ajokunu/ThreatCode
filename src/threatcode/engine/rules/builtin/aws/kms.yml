# Rules on KMS keys.
#
# The key policy is judged on its parsed statements (derived.allows_any_principal, see
# threatcode/ir/enrichment/aws_data.py), so the spelling of the JSON does not matter and a
# statement that names every principal but is limited to one organisation, account or source ARN
# is not reported.
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data
#   absence     the rule fires because something is missing (never above medium)

deprecated_ids:
  # Merged into KMS_KEY_EXPOSED: the two rules had the same condition and different severities.
  - KMS_WILDCARD_POLICY
  # deletion_window_in_days only sets the waiting period after the key is scheduled for deletion.
  # It defaults to 30 days, the longest allowed, so leaving it out is the safest setting.
  - KMS_NO_DELETION_PROTECTION

rules:
  - id: KMS_KEY_ROTATION_DISABLED
    title: KMS key rotation disabled
    description: >
      Automatic rotation is not enabled for the symmetric KMS key.
      Without rotation the same key material protects all data for the life of the key, so a
      single compromise of that material exposes everything ever encrypted with it.
      Asymmetric keys and HMAC keys cannot be rotated automatically and are not reported.
    stride_category: information_disclosure
    severity: low
    confidence: absence
    resource_type: aws_kms_key
    condition:
      all_of:
        - any_of:
            - enable_key_rotation:
                equals: false
            - enable_key_rotation:
                not_exists: true
        - any_of:
            - customer_master_key_spec:
                not_exists: true
            - customer_master_key_spec:
                equals: SYMMETRIC_DEFAULT
    mitigation: >
      Set enable_key_rotation to true.
      Rotation is free to turn on and keeps old key material for decrypting existing data.

  - id: KMS_KEY_EXPOSED
    title: KMS key policy allows every principal
    description: >
      The key policy has an Allow statement whose principal is "*" (or {"AWS": "*"}), with no
      condition that limits the caller such as aws:PrincipalOrgID, aws:SourceArn,
      aws:SourceAccount, aws:PrincipalArn or kms:CallerAccount.
      Any principal that IAM allows to call KMS can then use the key, and a statement that
      includes administrative actions lets them rewrite the key policy.
      Data encrypted with the key is only as private as the key.
    stride_category: information_disclosure
    severity: critical
    confidence: definitive
    root_cause: kms-open-key-policy
    resource_type: aws_kms_key
    condition:
      derived.allows_any_principal:
        equals: true
    mitigation: >
      Name the accounts, roles or services that may use the key in Principal.
      If a wildcard is unavoidable, add kms:CallerAccount or aws:PrincipalOrgID conditions.
    metadata:
      mitre:
        techniques: ["T1530"]
