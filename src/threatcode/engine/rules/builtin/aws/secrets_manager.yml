# Rules on Secrets Manager secrets.
#
# Rotation is configured by a separate aws_secretsmanager_secret_rotation resource (or the
# rotation_lambda_arn of the secret itself in older configurations), which the enrichment layer
# folds into the secret as derived.rotation_enabled.
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data
#   absence     the rule fires because something is missing (never above medium)

deprecated_ids:
  # A secret without a resource policy is governed by identity policies in its own account,
  # which is the safest default. The rule fired on every secret that had not been opened up.
  - SM_NO_RESOURCE_POLICY

rules:
  - id: SM_NO_ROTATION
    title: Secrets Manager secret without rotation
    description: >
      The secret has no automatic rotation configured.
      A secret that never changes stays valid for as long as it exists, so a credential that
      leaked months ago still works.
      Rotation limits how long a leaked value is useful.
    stride_category: information_disclosure
    severity: medium
    confidence: absence
    resource_type: aws_secretsmanager_secret
    condition:
      derived.rotation_enabled:
        equals: false
    mitigation: >
      Add an aws_secretsmanager_secret_rotation resource with a rotation Lambda function and a
      rotation_rules schedule of 90 days or less.
    metadata:
      mitre:
        techniques: ["T1555.006"]

  - id: SM_NO_KMS_KEY
    title: Secrets Manager secret not encrypted with a customer-managed KMS key
    description: >
      The secret uses the default AWS managed key (aws/secretsmanager) instead of a
      customer-managed KMS key.
      The secret is encrypted, but the AWS managed key cannot be restricted by a key policy you
      write and cannot be shared across accounts.
      A customer-managed key adds a second permission check and an audit trail on every read.
    stride_category: information_disclosure
    severity: low
    confidence: absence
    resource_type: aws_secretsmanager_secret
    condition:
      kms_key_id:
        not_exists: true
    mitigation: >
      Set kms_key_id to a customer-managed KMS key.
    metadata:
      mitre:
        techniques: ["T1555.006"]

  - id: SM_LONG_ROTATION
    title: Secrets Manager rotation interval exceeds 90 days
    description: >
      The rotation schedule rotates the secret less often than every 90 days.
      A long interval keeps a leaked value valid for months.
    stride_category: information_disclosure
    severity: low
    confidence: definitive
    resource_type: aws_secretsmanager_secret_rotation
    condition:
      rotation_rules.automatically_after_days:
        greater_than: 90
    mitigation: >
      Set automatically_after_days to 90 or less.
    metadata:
      mitre:
        techniques: ["T1555.006"]
