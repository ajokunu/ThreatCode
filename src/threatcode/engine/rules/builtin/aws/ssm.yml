# Rules on Systems Manager parameters.
#
# A String parameter is stored and returned in plaintext, which is right for a region name and
# wrong for a password.
# The rule judges the name: derived.secret_name is true when a whole word of the name (split on
# punctuation and capitals) says the value is a secret, see threatcode/ir/enrichment/aws_data.py.
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data
#   absence     the rule fires because something is missing (never above medium)

deprecated_ids:
  # A SecureString on the standard tier is encrypted with KMS like one on the advanced tier. The
  # advanced tier adds parameter policies, which is a feature and not a protection.
  - SSM_STANDARD_TIER_SECRET

rules:
  - id: SSM_UNENCRYPTED_PARAMETER
    title: SSM parameter with a secret name is stored as plain String
    description: >
      The parameter is a plain String but its name says it holds a secret, such as a password,
      token, API key or credential.
      String parameters are stored and returned in plaintext, so anyone with ssm:GetParameter
      reads the value without any permission on a KMS key, and the value appears in plaintext in
      the Terraform state.
      The conclusion comes from the name only, so it can be wrong for a name that merely
      mentions a secret.
    stride_category: information_disclosure
    severity: high
    confidence: heuristic
    resource_type: aws_ssm_parameter
    condition:
      all_of:
        - type:
            equals: String
        - derived.secret_name:
            equals: true
    mitigation: >
      Change the type to SecureString, ideally with a customer-managed key_id.
      Prefer Secrets Manager for credentials that need rotation.
    metadata:
      mitre:
        techniques: ["T1555.006"]

  - id: SSM_NO_DESCRIPTION
    title: SSM parameter without description
    description: >
      The parameter has no description, so its purpose and owner are not recorded.
      When a value changes unexpectedly, nobody can tell which system depends on it or who
      should have changed it.
    stride_category: repudiation
    severity: low
    confidence: absence
    resource_type: aws_ssm_parameter
    condition:
      description:
        not_exists: true
    mitigation: >
      Add a description that names the owner and the system that reads the parameter.

  - id: SSM_NO_ALLOWED_PATTERN
    title: SSM parameter without allowed pattern
    description: >
      The parameter does not define an allowed_pattern.
      Any value that fits the type can be stored, including a malformed one that a consumer
      then misreads.
    stride_category: tampering
    severity: low
    confidence: absence
    resource_type: aws_ssm_parameter
    condition:
      allowed_pattern:
        not_exists: true
    mitigation: >
      Define an allowed_pattern that matches the values the consumers expect.
