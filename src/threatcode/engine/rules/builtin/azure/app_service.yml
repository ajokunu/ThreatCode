# App Service. The rules cover the legacy azurerm_app_service and the azurerm 3.x and 4.x types
# azurerm_linux_web_app and azurerm_windows_web_app, which differ in some attribute names:
#   site_config.min_tls_version (legacy) and site_config.minimum_tls_version (new)
#   auth_settings.enabled (all) and auth_settings_v2.auth_enabled (new)
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data
#   absence     the rule fires because something is missing (never above medium)

rules:
  - id: APPSVC_HTTP_ONLY
    title: App Service accepts unencrypted HTTP
    description: >
      HTTPS-only is off, so clients can reach the app over plain HTTP and the traffic, including
      cookies and tokens, can be read or altered on the path.
      The provider default for https_only is false, so an app that never sets it accepts HTTP.
    stride_category: information_disclosure
    severity: high
    confidence: definitive
    resource_types: [azurerm_app_service, azurerm_linux_web_app, azurerm_windows_web_app]
    condition:
      https_only:
        equals: false
    mitigation: >
      Set https_only to true.
    metadata:
      mitre:
        techniques: ["T1557"]

  - id: APPSVC_NO_MANAGED_IDENTITY
    title: App Service without a managed identity
    description: >
      The app has no identity block, so it must hold static credentials to reach other Azure
      services.
      Static credentials are stored in settings, leak through logs and repositories, and do not
      rotate on their own.
    stride_category: spoofing
    severity: low
    confidence: absence
    root_cause: no-managed-identity
    resource_types: [azurerm_app_service, azurerm_linux_web_app, azurerm_windows_web_app]
    condition:
      identity:
        not_exists: true
    mitigation: >
      Add an identity block with a system-assigned or user-assigned managed identity and grant it
      the roles the app needs.
    metadata:
      mitre:
        techniques: ["T1078.004"]

  - id: APPSVC_OLD_TLS
    title: App Service allows TLS 1.0 or 1.1
    description: >
      The app's minimum TLS version is 1.0 or 1.1, both of which are deprecated and have known
      weaknesses.
      The provider default is 1.2, so this is an explicit choice.
    stride_category: information_disclosure
    severity: medium
    confidence: definitive
    resource_types: [azurerm_app_service, azurerm_linux_web_app, azurerm_windows_web_app]
    condition:
      any_of:
        - site_config.min_tls_version:
            matches_any: ["1.0", "1.1"]
        - site_config.minimum_tls_version:
            matches_any: ["1.0", "1.1"]
    mitigation: >
      Set site_config minimum_tls_version (min_tls_version for azurerm_app_service) to 1.2.
    metadata:
      mitre:
        techniques: ["T1557"]

  - id: APPSVC_FTP_ENABLED
    title: App Service allows plain FTP
    description: >
      The app's ftps_state is AllAllowed, so FTP deployment works without TLS and sends
      credentials and code in plaintext.
    stride_category: information_disclosure
    severity: medium
    confidence: definitive
    resource_types: [azurerm_app_service, azurerm_linux_web_app, azurerm_windows_web_app]
    condition:
      site_config.ftps_state:
        equals: "AllAllowed"
    mitigation: >
      Set site_config ftps_state to FtpsOnly or Disabled.
    metadata:
      mitre:
        techniques: ["T1040"]

  - id: APPSVC_NO_AUTH
    title: App Service authentication turned off
    description: >
      The app turns its built-in authentication off (auth_settings enabled is false, or
      auth_settings_v2 auth_enabled is false), so requests reach the app without the platform
      checking an identity.
      The application may still authenticate users itself.
    stride_category: spoofing
    severity: medium
    confidence: heuristic
    resource_types: [azurerm_app_service, azurerm_linux_web_app, azurerm_windows_web_app]
    condition:
      any_of:
        - auth_settings.enabled:
            equals: false
        - auth_settings_v2.auth_enabled:
            equals: false
    mitigation: >
      Enable App Service authentication with an identity provider, or confirm that the
      application authenticates every request itself.
    metadata:
      mitre:
        techniques: ["T1078.004"]
