# Legacy Azure SQL resources (azurerm_sql_server), which azurerm 3.x still accepts and azurerm
# 4.0 removed. Auditing and threat detection are inline blocks on these resources.
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data
#   absence     the rule fires because something is missing (never above medium)

deprecated_ids:
  # azurerm_sql_server has no public_network_access_enabled attribute, so the rule could never
  # fire. azurerm_mssql_server carries MSSQL_PUBLIC_ACCESS.
  - AZURE_SQL_PUBLIC_ACCESS
  # azurerm_sql_database has no transparent_data_encryption_enabled attribute, so the rule could
  # never fire. azurerm_mssql_database carries MSSQL_NO_TDE.
  - AZURE_SQL_NO_ENCRYPTION

rules:
  - id: AZURE_SQL_NO_AUDIT
    title: Azure SQL Server without auditing
    description: >
      The legacy SQL server has no extended_auditing_policy block, so logins, queries and
      administrative changes are not recorded.
    stride_category: repudiation
    severity: medium
    confidence: absence
    root_cause: no-audit-logging
    resource_type: azurerm_sql_server
    condition:
      extended_auditing_policy:
        not_exists: true
    mitigation: >
      Add an extended_auditing_policy block, or move to azurerm_mssql_server with an
      azurerm_mssql_server_extended_auditing_policy.

  - id: AZURE_SQL_NO_THREAT_DETECTION
    title: Azure SQL Server without threat detection
    description: >
      The legacy SQL server has no threat_detection_policy block, or the policy is disabled, so
      SQL injection attempts and anomalous access are not detected.
    stride_category: repudiation
    severity: medium
    confidence: absence
    root_cause: no-threat-detection
    resource_type: azurerm_sql_server
    condition:
      any_of:
        - threat_detection_policy:
            not_exists: true
        - threat_detection_policy.state:
            equals_ci: "Disabled"
    mitigation: >
      Add a threat_detection_policy block with state Enabled, or move to azurerm_mssql_server
      with an azurerm_mssql_server_security_alert_policy.
