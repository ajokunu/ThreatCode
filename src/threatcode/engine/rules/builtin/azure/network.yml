# Network security groups and virtual networks.
#
# Each NSG rule below is evaluated twice: on a standalone azurerm_network_security_rule (flat
# attributes) and on every inline security_rule block of an azurerm_network_security_group
# (any_item). A rule matches only an Inbound, Allow rule for TCP or any protocol whose source is
# the whole internet (a world prefix in source_address_prefix or source_address_prefixes) and
# whose destination ports overlap the ports the rule names. Deny rules and outbound rules never
# match. Priority is not evaluated, so a lower-numbered Deny rule that blocks the same traffic is
# not taken into account.
#
# The port rules (SSH, RDP, databases, web) skip a rule that opens every port: that case is
# reported once, by AZURE_NSG_ALLOW_ALL_INBOUND, instead of once per named port.
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data
#   absence     the rule fires because something is missing (never above medium)

rules:
  - id: AZURE_NSG_ALLOW_ALL_INBOUND
    title: NSG allows all inbound ports from the internet
    description: >
      A network security rule allows inbound traffic on every port from the whole internet
      (source *, Internet, Any, 0.0.0.0/0 or ::/0).
      Every service listening on a virtual machine or subnet behind this group is reachable
      by anyone, which is almost never intended and is often a leftover from debugging.
      Rule priority is not evaluated, so a lower-numbered Deny rule that blocks the traffic is
      not taken into account.
    stride_category: information_disclosure
    severity: critical
    confidence: definitive
    root_cause: nsg-world-ingress
    resource_types: [azurerm_network_security_rule, azurerm_network_security_group]
    condition:
      any_of:
        - all_of:
            - all_of: &inbound_world_tcp
                - direction:
                    equals_ci: "Inbound"
                - access:
                    equals_ci: "Allow"
                - any_of:
                    - protocol:
                        equals_ci: "Tcp"
                    - protocol:
                        equals_ci: "*"
                    - protocol:
                        equals_ci: "Any"
                - any_of:
                    - source_address_prefix:
                        is_world_cidr: true
                    - source_address_prefixes:
                        is_world_cidr: true
            - any_of: &every_port
                - destination_port_range:
                    matches_any: ["*", "0-65535"]
                - destination_port_ranges:
                    contains: "*"
                - destination_port_ranges:
                    contains: "0-65535"
        - security_rule:
            any_item:
              all_of:
                - all_of: *inbound_world_tcp
                - any_of: *every_port
    mitigation: >
      Replace the rule with one that names the ports the workload serves and the source ranges
      that need them, and remove the debugging rule.
    metadata:
      mitre:
        techniques: ["T1190"]

  - id: AZURE_NSG_SSH_OPEN
    title: NSG allows SSH from the internet
    description: >
      A network security rule allows inbound TCP on port 22 (alone, in a list or inside a port
      range) from the whole internet.
      SSH exposed to the internet is brute-forced and scanned continuously, and one weak
      credential or unpatched daemon gives a shell on the host.
      A rule that opens every port is reported by AZURE_NSG_ALLOW_ALL_INBOUND instead.
    stride_category: information_disclosure
    severity: high
    confidence: definitive
    root_cause: nsg-world-ingress
    resource_types: [azurerm_network_security_rule, azurerm_network_security_group]
    condition:
      any_of:
        - all_of:
            - all_of: *inbound_world_tcp
            - port_overlaps: [22]
            - not:
                any_of: *every_port
        - security_rule:
            any_item:
              all_of:
                - all_of: *inbound_world_tcp
                - port_overlaps: [22]
                - not:
                    any_of: *every_port
    mitigation: >
      Restrict the source to the addresses of your administrators or a bastion subnet, or
      remove the rule and use Azure Bastion or just-in-time VM access.
    metadata:
      mitre:
        techniques: ["T1133", "T1021.004"]

  - id: AZURE_NSG_RDP_OPEN
    title: NSG allows RDP from the internet
    description: >
      A network security rule allows inbound TCP on port 3389 (alone, in a list or inside a
      port range) from the whole internet.
      RDP exposed to the internet is a common ransomware entry point and is attacked by
      credential stuffing and by pre-authentication vulnerabilities.
      A rule that opens every port is reported by AZURE_NSG_ALLOW_ALL_INBOUND instead.
    stride_category: information_disclosure
    severity: high
    confidence: definitive
    root_cause: nsg-world-ingress
    resource_types: [azurerm_network_security_rule, azurerm_network_security_group]
    condition:
      any_of:
        - all_of:
            - all_of: *inbound_world_tcp
            - port_overlaps: [3389]
            - not:
                any_of: *every_port
        - security_rule:
            any_item:
              all_of:
                - all_of: *inbound_world_tcp
                - port_overlaps: [3389]
                - not:
                    any_of: *every_port
    mitigation: >
      Restrict the source to the addresses of your administrators or a bastion subnet, or
      remove the rule and use Azure Bastion or just-in-time VM access.
    metadata:
      mitre:
        techniques: ["T1133", "T1021.001"]

  - id: AZURE_NSG_DATABASE_PORT_OPEN
    title: NSG allows a database port from the internet
    description: >
      A network security rule allows inbound TCP on the default port of a database, cache or
      search engine (SQL Server, Oracle, MySQL, PostgreSQL, CouchDB, Redis, Cassandra,
      Elasticsearch, Memcached or MongoDB) from the whole internet.
      Data stores are rarely hardened for direct internet exposure and are scanned for
      continuously.
      A rule that opens every port is reported by AZURE_NSG_ALLOW_ALL_INBOUND instead.
    stride_category: information_disclosure
    severity: high
    confidence: definitive
    root_cause: nsg-world-ingress
    resource_types: [azurerm_network_security_rule, azurerm_network_security_group]
    condition:
      any_of:
        - all_of:
            - all_of: *inbound_world_tcp
            - &database_ports
              port_overlaps: [1433, 1521, 3306, 5432, 5984, 6379, 7000, 7001, 9042, 9200, 9300, 11211, 27017]
            - not:
                any_of: *every_port
        - security_rule:
            any_item:
              all_of:
                - all_of: *inbound_world_tcp
                - *database_ports
                - not:
                    any_of: *every_port
    mitigation: >
      Remove the rule and reach the data store through a private endpoint or from the application
      subnet only.
    metadata:
      mitre:
        techniques: ["T1190"]

  - id: AZURE_NSG_WEB_PORT_OPEN
    title: NSG allows web ports from the internet
    description: >
      A network security rule allows inbound TCP on port 80 or 443 from the whole internet.
      This is expected for a public web front end, so the finding is informational about the
      attack surface.
      It matters when the group also covers hosts that should not serve the internet, or when
      port 80 serves content that should be HTTPS only.
      A rule that opens every port is reported by AZURE_NSG_ALLOW_ALL_INBOUND instead.
    stride_category: information_disclosure
    severity: low
    confidence: definitive
    root_cause: nsg-world-ingress
    resource_types: [azurerm_network_security_rule, azurerm_network_security_group]
    condition:
      any_of:
        - all_of:
            - all_of: *inbound_world_tcp
            - &web_ports
              port_overlaps: [80, 443]
            - not:
                any_of: *every_port
        - security_rule:
            any_item:
              all_of:
                - all_of: *inbound_world_tcp
                - *web_ports
                - not:
                    any_of: *every_port
    mitigation: >
      Front the application with Azure Front Door or Application Gateway with a WAF and limit the
      source to that service tag, or confirm the group only covers public web servers.
    metadata:
      mitre:
        techniques: ["T1190"]

  - id: AZURE_VNET_NO_DDOS
    title: Virtual network without a DDoS Protection plan
    description: >
      The virtual network has no Azure DDoS Protection plan attached, or the plan is disabled.
      Every public IP address already gets the platform's basic DDoS protection, so this only
      matters for workloads that need the adaptive tuning, cost protection and rapid response
      of the paid plan.
    stride_category: denial_of_service
    severity: low
    confidence: absence
    root_cause: no-ddos-plan
    resource_type: azurerm_virtual_network
    condition:
      any_of:
        - ddos_protection_plan:
            not_exists: true
        - ddos_protection_plan.enable:
            equals: false
    mitigation: >
      Attach a DDoS Protection plan to virtual networks that host internet-facing production
      workloads.
    metadata:
      mitre:
        techniques: ["T1498"]
