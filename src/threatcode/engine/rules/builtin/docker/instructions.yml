# Rules on single Dockerfile instructions (RUN, ENV, ARG, ADD, COPY).
#
# ONBUILD <INSTRUCTION> is unwrapped by the parser, so these rules run on the trigger as well.
# Secret rules read key names only: a value is never copied into a property, and the value of
# a key that looks like a secret is masked in the instruction text.
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data (never above high)
#   absence     the rule fires because something is missing (never above medium)

rules:
  - id: DOCKER_ENV_SECRET
    title: ENV sets a secret-looking variable to a literal value
    description: >
      An ENV instruction gives a variable whose name looks like a secret (password, token,
      secret, API key, private key, credential) a literal value.
      ENV values are stored in the image configuration, so anyone who can pull the image reads
      them with docker inspect or docker history.
      Names that only mention a location (PATH, FILE, URL, NAME, ID suffixes), empty values,
      placeholders, paths such as /run/secrets/x and variable references are not flagged.
      ARG is covered by DOCKER_ARG_SECRET.
    stride_category: information_disclosure
    severity: high
    confidence: heuristic
    root_cause: secret-baked-into-image
    resource_type: dockerfile_env
    condition:
      has_secret_pattern:
        equals: true
    mitigation: >
      Remove the value from the image.
      Pass it at run time through the orchestrator's secret store, or use a BuildKit secret
      mount (RUN --mount=type=secret) for build-time use.
    metadata:
      mitre:
        techniques: ["T1552.001"]

  - id: DOCKER_ARG_SECRET
    title: ARG gives a secret-looking variable a literal default
    description: >
      An ARG instruction gives a variable whose name looks like a secret a literal default.
      Build arguments and their defaults are recorded in the image history, so anyone who can
      pull the image reads them with docker history.
      An ARG without a default is not flagged, because the value is supplied at build time
      from outside the file.
    stride_category: information_disclosure
    severity: high
    confidence: heuristic
    root_cause: secret-baked-into-image
    resource_type: dockerfile_arg
    condition:
      has_secret_pattern:
        equals: true
    mitigation: >
      Remove the default and pass the value with a BuildKit secret (docker build --secret and
      RUN --mount=type=secret) instead of a build argument.
    metadata:
      mitre:
        techniques: ["T1552.001"]

  - id: DOCKER_ADD_INSTEAD_OF_COPY
    title: ADD used for local files instead of COPY
    description: >
      ADD copies a local file or directory that is not an archive.
      ADD also fetches URLs and unpacks archives, so its behavior depends on what the source
      turns out to be; COPY only copies.
      ADD of a local archive (a .tar.gz, .tgz or .tar.xz) is the intended use of ADD and is not
      flagged.
    stride_category: tampering
    severity: low
    confidence: definitive
    resource_type: dockerfile_add
    condition:
      is_local_add:
        equals: true
    mitigation: >
      Use COPY for local files and directories.
    metadata: {}

  - id: DOCKER_SENSITIVE_FILE_COPY
    title: Sensitive file copied into the image
    description: >
      A COPY source looks like a private key, certificate bundle or environment file
      (.key, .pem, .p12, .pfx, id_rsa, .env).
      The file stays in an image layer even if a later instruction deletes it.
    stride_category: information_disclosure
    severity: high
    confidence: heuristic
    root_cause: secret-baked-into-image
    resource_type: dockerfile_copy
    condition:
      has_sensitive_file:
        equals: true
    mitigation: >
      Mount the file at run time from a secret store, or use a BuildKit secret mount
      (RUN --mount=type=secret) so it never enters a layer.
    metadata:
      mitre:
        techniques: ["T1552.001"]

  - id: DOCKER_SENSITIVE_FILE_ADD
    title: Sensitive file added to the image
    description: >
      An ADD source looks like a private key, certificate bundle or environment file
      (.key, .pem, .p12, .pfx, id_rsa, .env).
      The file stays in an image layer even if a later instruction deletes it.
    stride_category: information_disclosure
    severity: high
    confidence: heuristic
    root_cause: secret-baked-into-image
    resource_type: dockerfile_add
    condition:
      has_sensitive_file:
        equals: true
    mitigation: >
      Mount the file at run time from a secret store, or use a BuildKit secret mount
      (RUN --mount=type=secret) so it never enters a layer.
    metadata:
      mitre:
        techniques: ["T1552.001"]

  - id: DOCKER_RUN_SUDO
    title: sudo used in RUN
    description: >
      A RUN command runs sudo, including after env, command or a VAR=value prefix.
      Build steps already run as root unless USER says otherwise, so sudo adds a setuid binary
      to the image that a later attacker can use to gain root.
      A package merely named sudo (apt-get install sudo) is not a use of sudo.
    stride_category: elevation_of_privilege
    severity: low
    confidence: definitive
    resource_type: dockerfile_run
    condition:
      has_sudo:
        equals: true
    mitigation: >
      Remove sudo. Run the step as root, or switch users with USER around it.
    metadata:
      mitre:
        techniques: ["T1548.003"]

  - id: DOCKER_RUN_CURL_PIPE
    title: Download piped into a shell or interpreter in RUN
    description: >
      A RUN command pipes the output of curl or wget into sh, bash, zsh, dash, ash, ksh,
      python, perl, ruby or node, in a pipeline or a heredoc body.
      The script runs without verification, so whoever controls the server or a network
      position on the path runs code in the build.
      A pipe into a checksum or an archive tool (sha256sum, tar) is not flagged.
    stride_category: tampering
    severity: high
    confidence: definitive
    resource_type: dockerfile_run
    condition:
      has_curl_pipe:
        equals: true
    mitigation: >
      Download to a file, verify its checksum or signature, then run it.
    metadata:
      mitre:
        techniques: ["T1195.002"]

  - id: DOCKER_APT_NO_RECOMMENDS
    title: apt-get install without --no-install-recommends
    description: >
      An apt-get install command does not pass --no-install-recommends, so apt installs
      suggested packages the application does not need.
      Each extra package is more code to patch.
    stride_category: denial_of_service
    severity: low
    confidence: definitive
    root_cause: oversized-image
    resource_type: dockerfile_run
    condition:
      has_apt_no_recommends:
        equals: true
    mitigation: >
      Add --no-install-recommends to apt-get install.
    metadata: {}

  - id: DOCKER_COPY_NO_CHOWN
    title: COPY into the final stage of a non-root image without --chown
    description: >
      A COPY in the final stage has no --chown, and the image runs as a non-root user.
      The files are owned by root.
      That is the safer default for application code that never changes, and the wrong one for
      a directory the process must write to, so this is a prompt to decide, not a defect.
      COPY --from another stage, COPY in a build stage, and any COPY in an image that runs as
      root or as a user that is not known are not flagged.
    stride_category: elevation_of_privilege
    severity: low
    confidence: heuristic
    resource_type: dockerfile_copy
    condition:
      chown_missing:
        equals: true
    mitigation: >
      Use COPY --chown=user:group for files the process writes, and leave code root-owned.
    metadata: {}

  - id: DOCKER_ADD_FROM_URL
    title: ADD downloads a URL without a checksum
    description: >
      An ADD instruction fetches a remote URL at build time with no --checksum.
      The content can change between builds, or be replaced in transit, and it goes into the
      image unverified.
    stride_category: tampering
    severity: medium
    confidence: definitive
    resource_type: dockerfile_add
    condition:
      all_of:
        - is_url_add:
            equals: true
        - has_checksum:
            equals: false
    mitigation: >
      Add --checksum=sha256:<digest> to the ADD, or download with curl in a RUN step and verify
      the file before using it.
    metadata:
      mitre:
        techniques: ["T1195.002"]

  - id: DOCKER_APT_NO_CLEAN
    title: apt-get install without cleaning the package lists
    description: >
      A RUN command runs apt-get install and never runs apt-get clean or removes
      /var/lib/apt/lists in the same RUN.
      The package lists stay in the layer, adding weight and stale metadata to the image.
      A RUN with a BuildKit cache mount on the apt directories is not flagged.
    stride_category: denial_of_service
    severity: low
    confidence: absence
    root_cause: oversized-image
    resource_type: dockerfile_run
    condition:
      has_apt_no_clean:
        equals: true
    mitigation: >
      End the same RUN with rm -rf /var/lib/apt/lists/*, or mount the apt cache with
      RUN --mount=type=cache.
    metadata: {}
