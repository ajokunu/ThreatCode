# Rules on BigQuery datasets (google_bigquery_dataset).
#
# Access is given in three places: access blocks on the dataset, and the separate resources
# google_bigquery_dataset_access, google_bigquery_dataset_iam_member and _iam_binding.
# ir/enrichment/companions.py folds all of them into derived.access_members of the dataset (the
# special_group, iam_member, user, group and domain entries, with a special group written
# as itself), so a rule reads one list whichever form the configuration used.
#
# BQ_NO_LOCATION is deprecated: location has a default (US), and a dataset in the default region
# is a data residency choice, not a weakness.
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data
#   absence     the rule fires because something is missing (never above medium)

deprecated_ids:
  - BQ_NO_LOCATION

rules:
  - id: BQ_PUBLIC_ACCESS
    title: BigQuery dataset allows public access
    description: >
      The dataset grants access to allUsers or allAuthenticatedUsers, through an access block
      (special_group or iam_member) or through a dataset IAM member, binding or access resource.
      Anyone on the internet, or anyone with a Google account, can read its tables.
    stride_category: information_disclosure
    severity: critical
    confidence: definitive
    root_cause: gcp-public-iam-principal
    resource_type: google_bigquery_dataset
    condition:
      any_of:
        - derived.access_members:
            contains: "allUsers"
        - derived.access_members:
            contains: "allAuthenticatedUsers"
    mitigation: >
      Remove allUsers and allAuthenticatedUsers from the dataset's access entries and grant
      access to specific users, groups or service accounts.
    metadata:
      mitre:
        techniques: ["T1530"]

  - id: BQ_NO_ENCRYPTION
    title: BigQuery dataset not using a customer-managed key
    description: >
      The dataset has no default_encryption_configuration, so new tables use Google-managed keys.
      The data is encrypted at rest either way.
      A customer-managed key adds control over rotation and lets you revoke access to the data.
    stride_category: information_disclosure
    severity: low
    confidence: absence
    root_cause: gcp-no-cmek
    resource_type: google_bigquery_dataset
    condition:
      default_encryption_configuration:
        not_exists: true
    mitigation: >
      Set default_encryption_configuration.kms_key_name to a Cloud KMS key when policy requires
      customer-managed keys.

  - id: BQ_NO_ACCESS_POLICY
    title: BigQuery dataset without explicit access entries
    description: >
      The dataset has no access block and no companion access, IAM member or IAM binding
      resource, so only the default project roles apply.
      Access then follows project-level roles, which are usually broader than the dataset needs.
    stride_category: elevation_of_privilege
    severity: low
    confidence: absence
    root_cause: bigquery-default-access
    resource_type: google_bigquery_dataset
    condition:
      all_of:
        - access:
            not_exists: true
        - derived.access_members:
            is_empty: true
    mitigation: >
      Define access entries that grant least-privilege roles to the groups that use the dataset.
