# Rules on Pub/Sub topics (google_pubsub_topic).
#
# PUBSUB_NO_DEAD_LETTER and PUBSUB_NO_RETENTION are deprecated: a missing dead letter topic or
# retention window is a reliability preference, and neither lets an attacker do anything.
#
# Calibration: each rule declares how its condition was established.
#   definitive  the configuration proves the condition
#   heuristic   the condition is inferred from names or partial data
#   absence     the rule fires because something is missing (never above medium)

deprecated_ids:
  - PUBSUB_NO_DEAD_LETTER
  - PUBSUB_NO_RETENTION

rules:
  - id: PUBSUB_NO_ENCRYPTION
    title: Pub/Sub topic not using a customer-managed key
    description: >
      The topic has no kms_key_name, so its messages use Google-managed keys.
      The messages are encrypted at rest either way.
      A customer-managed key adds control over rotation and lets you revoke access to the data.
    stride_category: information_disclosure
    severity: low
    confidence: absence
    root_cause: gcp-no-cmek
    resource_type: google_pubsub_topic
    condition:
      kms_key_name:
        not_exists: true
    mitigation: >
      Set kms_key_name to a Cloud KMS key when policy requires customer-managed keys.
