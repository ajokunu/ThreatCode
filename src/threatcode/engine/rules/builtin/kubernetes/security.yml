# Rules on Namespaces, ServiceAccounts and the pod-level security settings of workloads.
#
# Calibration: definitive (the configuration proves it), heuristic (inferred, never above
# high) and absence (something is missing, never above medium). See workloads.yml.
#
# Pod security settings are read through the effective values the parser computes: a pod-level
# seccompProfile satisfies every container, and a container value beats the pod's.

rules:
  - id: K8S_NO_PSA_LABELS
    title: Namespace without Pod Security Admission enforce label
    description: >
      The namespace does not carry the pod-security.kubernetes.io/enforce label.
      Without it the Pod Security Admission controller admits pods of any security level into
      the namespace, unless a cluster-wide default says otherwise.
      The label is read as one key, dots and slash included.
    stride_category: elevation_of_privilege
    severity: medium
    confidence: absence
    resource_type: kubernetes_namespace
    condition:
      labels.pod-security.kubernetes.io/enforce:
        not_exists: true
    mitigation: >
      Label the namespace pod-security.kubernetes.io/enforce with baseline or restricted.
    metadata:
      mitre:
        techniques: ["T1611"]

  - id: K8S_DEFAULT_SERVICE_ACCOUNT
    title: Pod uses the default service account
    description: >
      The pod runs as the default ServiceAccount of its namespace, either by name or because
      it names none.
      Every pod that does the same shares its identity, and anything granted to the default
      account is granted to all of them.
    stride_category: elevation_of_privilege
    severity: low
    confidence: absence
    resource_type: "@kubernetes_pod_workloads"
    condition:
      service_account_name:
        equals: "default"
    mitigation: >
      Create a dedicated ServiceAccount with only the permissions the workload needs and set
      serviceAccountName.
    metadata:
      mitre:
        techniques: ["T1078.001"]

  - id: K8S_NO_SECURITY_CONTEXT_DEFAULTS
    title: Pod without pod-level runAsNonRoot
    description: >
      The pod spec does not set runAsNonRoot in a pod-level securityContext.
      Settings made on single containers are easy to miss on the next container someone adds,
      and only the pod level also covers init and ephemeral containers.
    stride_category: elevation_of_privilege
    severity: low
    confidence: absence
    root_cause: container_hardening
    resource_type: "@kubernetes_pod_workloads"
    condition:
      pod_run_as_non_root:
        not_exists: true
    mitigation: >
      Set a pod-level securityContext with runAsNonRoot: true, a non-zero runAsUser and an
      fsGroup.
    metadata:
      mitre:
        techniques: ["T1611"]

  - id: K8S_AUTOMOUNT_DEFAULT
    title: ServiceAccount does not disable token automounting
    description: >
      The ServiceAccount does not set automountServiceAccountToken: false, so every pod that
      runs as it receives a token for the Kubernetes API unless the pod opts out.
      K8S_AUTOMOUNT_SA_TOKEN reports the same advice for a workload; a pod-level setting
      overrides this one.
    stride_category: elevation_of_privilege
    severity: low
    confidence: absence
    root_cause: sa_token_automount
    resource_type: kubernetes_service_account
    condition:
      automount_sa_token:
        not_equals: false
    mitigation: >
      Set automountServiceAccountToken: false on the ServiceAccount and enable it per pod
      where the workload calls the API.
    metadata:
      mitre:
        techniques: ["T1528"]

  - id: K8S_NO_SECCOMP_PROFILE
    title: Container without a seccomp profile
    description: >
      No seccomp profile is set for at least one container, at the container level or the pod
      level, or a container uses Unconfined.
      System calls are not filtered, which widens the kernel attack surface.
      A pod-level seccompProfile of RuntimeDefault or Localhost satisfies every container
      that does not override it.
    stride_category: elevation_of_privilege
    severity: medium
    confidence: absence
    root_cause: container_hardening
    resource_type: "@kubernetes_pod_workloads"
    condition:
      any_of:
        - has_seccomp_profile:
            equals: false
        - seccomp_profile_type:
            equals: "Unconfined"
    mitigation: >
      Set seccompProfile.type to RuntimeDefault in the pod securityContext, or to Localhost
      with a custom profile.
    metadata:
      mitre:
        techniques: ["T1611"]
