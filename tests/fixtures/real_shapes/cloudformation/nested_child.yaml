AWSTemplateFormatVersion: "2010-09-09"
Description: Network layer used as a nested stack

Parameters:
  Environment:
    Type: String

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.1.0/24

Outputs:
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
