AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless orders API

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref OrdersTable

Parameters:
  Stage:
    Type: String
    Default: prod

Resources:
  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: orders.handler
      CodeUri: src/orders/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:orders/*"
      Events:
        List:
          Type: Api
          Properties:
            Path: /orders
            Method: get
        Create:
          Type: Api
          Properties:
            Path: /orders
            Method: post

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: admin.handler
      CodeUri: src/admin/
      Policies:
        - AdministratorAccess
      Events:
        Admin:
          Type: HttpApi
          Properties:
            Path: /admin
            Method: any

  OrdersTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String

Outputs:
  ApiUrl:
    Description: Invoke URL of the API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/orders"
