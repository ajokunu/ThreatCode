apiVersion: v1
kind: Namespace
metadata:
  name: hardened
  labels:
    name: hardened
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: hardened
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: hardened
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hardened
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: init-config
          image: registry.example.com/hardened/init:1.2.0@sha256:0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
          command: ["/bin/init"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 50m, memory: 32Mi, ephemeral-storage: 32Mi}
      containers:
        - name: web
          image: registry.example.com/hardened/web:2.4.1@sha256:1a2b3c4d5e6f70818293a4b5c6d7e8f91a2b3c4d5e6f70818293a4b5c6d7e8f9
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 128Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
        - name: log-shipper
          image: registry.example.com/hardened/shipper:0.9.1@sha256:2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 100m, memory: 64Mi, ephemeral-storage: 32Mi}
          readinessProbe:
            exec: {command: ["/bin/shipper", "-ready"]}
          livenessProbe:
            exec: {command: ["/bin/shipper", "-alive"]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: queue
  namespace: hardened
spec:
  serviceName: queue
  replicas: 3
  selector:
    matchLabels: {app: queue}
  template:
    metadata:
      labels: {app: queue}
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: queue
          image: registry.example.com/hardened/queue:5.1.0@sha256:3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 128Mi}
          readinessProbe:
            tcpSocket: {port: 5672}
          livenessProbe:
            tcpSocket: {port: 5672}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: hardened
spec:
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: registry.example.com/hardened/agent:1.0.3@sha256:4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 100m, memory: 64Mi, ephemeral-storage: 32Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 9100}
          livenessProbe:
            httpGet: {path: /healthz, port: 9100}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: worker
  namespace: hardened
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: registry.example.com/hardened/worker:3.0.0@sha256:5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 200m, memory: 128Mi, ephemeral-storage: 32Mi}
          readinessProbe:
            exec: {command: ["/bin/worker", "-ready"]}
          livenessProbe:
            exec: {command: ["/bin/worker", "-alive"]}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: reindex
  namespace: hardened
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10004
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reindex
          image: registry.example.com/hardened/reindex:3.1.0@sha256:6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 128Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: hardened
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: app
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10005
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: report
              image: registry.example.com/hardened/report:4.2.1@sha256:708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
                limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 128Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: hardened
spec:
  serviceAccountName: app
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10006
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: toolbox
      image: registry.example.com/hardened/toolbox:1.0.0@sha256:8192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f70
      command: ["/bin/sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      resources:
        requests: {cpu: 10m, memory: 16Mi, ephemeral-storage: 16Mi}
        limits: {cpu: 50m, memory: 32Mi, ephemeral-storage: 32Mi}
      readinessProbe:
        exec: {command: ["/bin/true"]}
      livenessProbe:
        exec: {command: ["/bin/true"]}
