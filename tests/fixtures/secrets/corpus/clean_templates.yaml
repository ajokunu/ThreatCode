# None of these is a literal secret
db:
  password: "{{ .Values.db.password }}"
  db_password: "{{ vault_db_password }}"
  url_password: ${DB_PASSWORD}
  quoted_password: "${DB_PASSWORD}"
  empty_password: ""
  hcl_reference: var.database_password
  token_name: ANTHROPIC_AUTH_TOKEN
  secret_path: /run/secrets/db_password
  placeholder: changeme
  masked: "********"
  workflow: ${{ secrets.DEPLOY_TOKEN }}
  header: "Authorization: Bearer ${API_TOKEN}"
  url: postgres://admin:${DB_PASSWORD}@db.internal:5432/app
  local: postgres://admin:Zx9fQ2mLp7@localhost:5432/app
