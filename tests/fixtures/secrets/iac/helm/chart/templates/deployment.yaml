apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: DB_PASSWORD
              value: "{{ .Values.database.password }}"
            - name: LEGACY_PASSWORD
              value: "Hunter2!Hunter2"
            - name: SESSION_KEY
              value: {{ .Values.session.key | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-legacy
data:
  password: "Hunter2!Hunter2"
  url: "{{ .Values.database.url }}"
