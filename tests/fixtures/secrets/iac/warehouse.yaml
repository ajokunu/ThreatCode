AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  DbSize:
    Type: String
    Default: small
Resources:
  WarehouseCluster:
    Type: AWS::Redshift::Cluster
    Properties:
      ClusterType: single-node
      NodeType: dc2.large
      DBName: analytics
      MasterUsername: admin
      MasterUserPassword: "WarehouseP@ss2026"
      PubliclyAccessible: false
  OrdersDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      MasterUsername: orders
      MasterUserPassword: "{{resolve:secretsmanager:orders-db:SecretString:password}}"
  ReportBucket:
    Type: AWS::S3::Bucket
Outputs:
  ClusterName:
    Value: !Ref WarehouseCluster
