AWSTemplateFormatVersion: "2010-09-09"
Resources:
  Worker:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: worker
      Handler: index.handler
      Runtime: python3.12
      Code:
        S3Bucket: code-bucket
        S3Key: worker.zip
      Role: arn:aws:iam::111122223333:role/cluster
      VpcConfig:
        SubnetIds: [subnet-0a1b2c3d]
        SecurityGroupIds: [sg-0a1b2c3d4e]
