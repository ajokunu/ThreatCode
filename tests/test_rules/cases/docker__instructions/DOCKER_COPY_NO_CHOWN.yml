# Only a COPY in the final stage of a non-root image can leave files with the wrong owner:
# build stages are scratch space, COPY --from has its own owner and a root image has no
# mismatch.
cases:
  - format: docker
    bad: |
      FROM golang:1.22 AS build
      COPY . /src
      RUN go build -o /out/app ./cmd/app

      FROM debian:12-slim
      COPY --from=build /out/app /app
      COPY config.yaml /etc/app/config.yaml
      USER 10001
    good: |
      FROM golang:1.22 AS build
      COPY . /src
      RUN go build -o /out/app ./cmd/app

      FROM debian:12-slim
      COPY --from=build /out/app /app
      COPY --chown=10001:10001 config.yaml /etc/app/config.yaml
      USER 10001
  - format: docker
    bad: |
      FROM debian:12-slim
      COPY app /app
      USER app
    good: |
      FROM debian:12-slim
      COPY app /app
