# Every KEY=VALUE pair of an ENV line is judged, whole words of the name decide, and the
# value matters: references, paths, empty values and placeholders are not secrets.
cases:
  - format: docker
    bad: |
      FROM debian:12-slim
      ENV APP=web DB_PASSWORD=hunter2 PORT=80
    good: |
      FROM debian:12-slim
      ENV APP=web DB_HOST=db PORT=80
  - format: docker
    bad: |
      FROM debian:12-slim
      ENV API_KEY "sk-live-0123456789abcdef"
    good: |
      FROM debian:12-slim
      ENV KEYBOARD_LAYOUT=us AUTHORS=team PUBLIC_KEY_PATH=/etc/keys/pub SECRET_FILE=/run/secrets/db
  - format: docker
    bad: |
      FROM debian:12-slim
      ENV githubToken=ghp_0123456789abcdef0123456789abcdef0123
    good: |
      FROM debian:12-slim
      ARG REF=main
      ENV API_TOKEN=${REF} DB_PASSWORD= ADMIN_SECRET=changeme AUTH_TOKEN=/run/secrets/auth
